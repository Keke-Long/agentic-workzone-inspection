<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Agentic S-RAG workflow for work-zone inspection</title>
  <desc id="desc">A three-stage method diagram. Case context and multi-view images enter a multimodal agent. The agent iteratively calls a Structured-RAG regulation tool and audited scene-evidence tools, updates its evidence state, and then passes through an evidence-sufficiency gate to produce a structured autonomous inspection record or an evidence-insufficient not-assessed result.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526576"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#256AA6"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#167C80"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#B66A19"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#31815D"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212B; }
      .stage { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
      .title { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .code { font-family: "Courier New", monospace; font-size: 15px; }
      .edge-label { font-size: 15px; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #687B8C; stroke-width: 2; }
      .line-gray { fill: none; stroke: #526576; stroke-width: 2.2; marker-end: url(#arrow-gray); }
      .line-blue { fill: none; stroke: #256AA6; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .line-teal { fill: none; stroke: #167C80; stroke-width: 2.4; marker-end: url(#arrow-teal); }
      .line-orange { fill: none; stroke: #B66A19; stroke-width: 2.4; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- Stage backgrounds -->
  <rect x="20" y="20" width="300" height="860" rx="18" fill="#F5F7F9" stroke="#BCC7D1" stroke-width="2"/>
  <rect x="340" y="20" width="870" height="860" rx="18" fill="#F3F8FD" stroke="#77A8D8" stroke-width="2.5"/>
  <rect x="1230" y="20" width="350" height="860" rx="18" fill="#F8F9FA" stroke="#BCC7D1" stroke-width="2"/>

  <text x="42" y="60" class="stage">1  CASE CONTEXT</text>
  <text x="362" y="60" class="stage">2  AGENTIC EVIDENCE ACQUISITION</text>
  <text x="1252" y="60" class="stage">3  INSPECTION OUTPUT</text>

  <!-- Stage 1: input cards -->
  <rect x="48" y="125" width="244" height="225" rx="15" class="box"/>
  <text x="70" y="163" class="title">Inspection request</text>
  <line x1="70" y1="178" x2="270" y2="178" stroke="#D4DBE1" stroke-width="2"/>
  <text x="70" y="212" class="body">Region</text>
  <text x="70" y="244" class="body">Inspection item + target</text>
  <text x="70" y="276" class="body">Reviewed-observation IDs</text>
  <text x="70" y="308" class="body">MUTCD Section / TA scope</text>

  <rect x="48" y="405" width="244" height="175" rx="15" class="box"/>
  <text x="70" y="443" class="title">Visual observations</text>
  <line x1="70" y1="458" x2="270" y2="458" stroke="#D4DBE1" stroke-width="2"/>
  <rect x="70" y="482" width="65" height="50" rx="5" fill="#E5ECF2" stroke="#687B8C"/>
  <rect x="116" y="494" width="65" height="50" rx="5" fill="#D9E6F0" stroke="#687B8C"/>
  <rect x="162" y="482" width="65" height="50" rx="5" fill="#CFE0EC" stroke="#687B8C"/>
  <text x="70" y="561" class="small">Time-ordered multi-view frames</text>

  <rect x="48" y="640" width="244" height="158" rx="15" fill="#EEF1F4" stroke="#8796A3" stroke-width="1.8"/>
  <text x="70" y="677" class="title">Frozen evidence policy</text>
  <text x="70" y="710" class="small">Human bbox decisions are shared</text>
  <text x="70" y="737" class="small">Geometry is diagnostic only</text>
  <text x="70" y="764" class="small">No unseen-device assumptions</text>

  <!-- Stage 2: controller -->
  <rect x="380" y="135" width="350" height="255" rx="17" fill="#DCEEFF" stroke="#256AA6" stroke-width="3"/>
  <text x="405" y="176" class="title">Multimodal inspection agent</text>
  <text x="405" y="205" class="small" fill="#3A5872">LLM controller + shared evidence state</text>
  <line x1="405" y1="220" x2="705" y2="220" stroke="#A9CAE5" stroke-width="2"/>
  <circle cx="417" cy="251" r="12" fill="#256AA6"/><text x="413" y="257" class="small" fill="#FFFFFF" font-weight="700">1</text>
  <text x="440" y="257" class="body">Identify the evidence gap</text>
  <circle cx="417" cy="291" r="12" fill="#256AA6"/><text x="413" y="297" class="small" fill="#FFFFFF" font-weight="700">2</text>
  <text x="440" y="297" class="body">Choose the next tool</text>
  <circle cx="417" cy="331" r="12" fill="#256AA6"/><text x="413" y="337" class="small" fill="#FFFFFF" font-weight="700">3</text>
  <text x="440" y="337" class="body">Observe, revise, and iterate</text>
  <text x="405" y="370" class="small" font-weight="700" fill="#256AA6">Adaptive sequence—not a fixed tool chain</text>

  <!-- Stage 2: Structured-RAG -->
  <rect x="785" y="90" width="390" height="300" rx="17" fill="#DDF4F1" stroke="#167C80" stroke-width="3"/>
  <text x="810" y="130" class="title">Structured manual retrieval (S-RAG)</text>
  <text x="810" y="159" class="code">retrieve_regulation(region, item, query)</text>
  <line x1="810" y1="176" x2="1150" y2="176" stroke="#9CCFCB" stroke-width="2"/>
  <text x="810" y="208" class="body" font-weight="700">A. Structure-aware routing</text>
  <text x="830" y="235" class="small">region × inspection item</text>
  <text x="810" y="268" class="body" font-weight="700">B. Audited rule representation</text>
  <text x="830" y="295" class="small">required elements · spacing · charts · notes</text>
  <text x="810" y="328" class="body" font-weight="700">C. Source-grounded retrieval</text>
  <text x="830" y="355" class="small">scoped BM25 pages · citations · warnings</text>

  <!-- Stage 2: scene tools -->
  <rect x="785" y="465" width="390" height="275" rx="17" fill="#FFF0DC" stroke="#B66A19" stroke-width="2.7"/>
  <text x="810" y="505" class="title">Audited scene-evidence tools</text>
  <line x1="810" y1="521" x2="1150" y2="521" stroke="#E9C79E" stroke-width="2"/>
  <text x="810" y="555" class="code">get_reviewed_observations(ids)</text>
  <text x="810" y="585" class="code">get_region_device_summary(region)</text>
  <text x="810" y="615" class="code">get_region_spacing(region)</text>
  <text x="810" y="655" class="small">Accepted 2D boxes + boundary-aware inventory</text>
  <text x="810" y="683" class="small">Diagnostic spacing + explicit limitations</text>
  <text x="810" y="716" class="tiny" fill="#72512D">4,445 decisions · user corrections · processed scene</text>

  <!-- Stage 2: evidence-state update -->
  <rect x="380" y="515" width="350" height="205" rx="17" fill="#EAF4FD" stroke="#256AA6" stroke-width="2.5"/>
  <text x="405" y="555" class="title">Evidence-state update</text>
  <line x1="405" y1="570" x2="705" y2="570" stroke="#B8D4EA" stroke-width="2"/>
  <text x="405" y="605" class="body">Fuse visual, regulatory, and scene evidence</text>
  <text x="405" y="640" class="body">Preserve provenance and tool warnings</text>
  <text x="405" y="675" class="body">Retrieve again—or stop and synthesize</text>

  <!-- Input to controller -->
  <path d="M292 235 H345 V220 H380" class="line-gray"/>
  <text x="308" y="210" class="edge-label" fill="#526576">task</text>
  <path d="M292 492 H340 V335 H380" class="line-gray"/>
  <text x="302" y="470" class="edge-label" fill="#526576">images</text>

  <!-- Controller to tools -->
  <path d="M730 215 H785" class="line-teal"/>
  <text x="738" y="199" class="edge-label" fill="#167C80">rule call</text>
  <path d="M730 322 H755 V585 H785" class="line-orange"/>
  <text x="738" y="433" class="edge-label" fill="#915313" transform="rotate(90 738 433)">scene call</text>

  <!-- Tool returns to evidence state -->
  <path d="M900 390 V425 H755 V585 H730" class="line-teal"/>
  <text x="830" y="417" class="edge-label" fill="#167C80">structured rule package</text>
  <path d="M785 650 H730" class="line-orange"/>
  <text x="738" y="635" class="edge-label" fill="#915313">audited evidence</text>

  <!-- Iteration loop -->
  <path d="M535 515 V390" fill="none" stroke="#256AA6" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
  <text x="548" y="457" class="edge-label" fill="#256AA6">continue while</text>
  <text x="548" y="478" class="edge-label" fill="#256AA6">evidence is missing</text>

  <!-- Synthesis route to stage 3 -->
  <path d="M730 696 V805 H1195 V240 H1270" class="line-blue"/>
  <text x="905" y="829" class="edge-label" fill="#256AA6">stop and synthesize</text>

  <!-- Stage 3: gate -->
  <polygon points="1405,145 1545,235 1405,325 1265,235" fill="#EDF1F4" stroke="#596979" stroke-width="2.5"/>
  <text x="1405" y="221" class="title" text-anchor="middle">Required evidence</text>
  <text x="1405" y="250" class="title" text-anchor="middle">sufficient?</text>

  <rect x="1265" y="390" width="280" height="105" rx="15" fill="#E3F4EA" stroke="#31815D" stroke-width="2.5"/>
  <text x="1405" y="429" class="title" text-anchor="middle" fill="#27694B">YES — supported</text>
  <text x="1405" y="461" class="small" text-anchor="middle">compliant / potentially deficient</text>

  <rect x="1265" y="535" width="280" height="120" rx="15" fill="#FFF0DC" stroke="#B66A19" stroke-width="2.5"/>
  <text x="1405" y="574" class="title" text-anchor="middle" fill="#915313">NO — do not assert</text>
  <text x="1405" y="606" class="small" text-anchor="middle">not assessed</text>
  <text x="1405" y="630" class="small" text-anchor="middle">no human handoff</text>

  <path d="M1360 310 V390" fill="none" stroke="#31815D" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <text x="1328" y="359" class="edge-label" fill="#27694B">yes</text>
  <path d="M1450 310 H1560 V595 H1545" fill="none" stroke="#B66A19" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <text x="1452" y="345" class="edge-label" fill="#915313">no / unresolved</text>

  <!-- Structured output -->
  <rect x="1265" y="715" width="280" height="135" rx="15" fill="#E9EDF1" stroke="#424F5A" stroke-width="2.7"/>
  <text x="1405" y="753" class="title" text-anchor="middle" font-size="21">Structured inspection record</text>
  <text x="1288" y="786" class="small">applicability · status · confidence</text>
  <text x="1288" y="813" class="small">selected items · evidence · basis</text>
  <text x="1288" y="840" class="small">rationale · evidence sufficiency</text>
  <path d="M1335 495 V510 H1248 V690 H1380 V715" class="line-gray"/>
  <path d="M1445 655 V690 H1430 V715" class="line-gray"/>
</svg>
